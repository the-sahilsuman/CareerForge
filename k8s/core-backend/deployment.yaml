apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-backend
  namespace: careerforge
  labels:
    app: core-backend

spec:
  replicas: 2

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: core-backend

  template:
    metadata:
      labels:
        app: core-backend

    spec:

      serviceAccountName: core-backend

      terminationGracePeriodSeconds: 30

      containers:
        - name: core-backend

          image: 142545058839.dkr.ecr.ap-south-1.amazonaws.com/careerforge/core-backend:v1

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:

            - configMapRef:
                name: core-backend-config

            - secretRef:
                name: core-backend-secrets

          resources:
            requests:
              cpu: 250m
              memory: 512Mi

            limits:
              cpu: 1000m
              memory: 1Gi

          readinessProbe:
            httpGet:
              path: /
              port: http

            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: http

            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL