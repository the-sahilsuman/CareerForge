apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: careerforge
  labels:
    app: frontend
    app.kubernetes.io/part-of: careerforge

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: careerforge

    spec:
      containers:
        - name: frontend

          image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/careerforge-frontend:IMAGE_TAG

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3