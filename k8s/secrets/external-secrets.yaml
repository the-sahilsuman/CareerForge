apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: core-backend-secrets
  namespace: careerforge

spec:

  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: core-backend-secrets

    creationPolicy: Owner

  dataFrom:
    - extract:
        key: careerforge/prod/core-backend

