apiVersion: v1
kind: Secret
metadata:
  name: core-backend-secret
  namespace: careerforge
type: Opaque

stringData:
  DATABASE_URL: "REPLACE_WITH_PRODUCTION_DATABASE_URL"

  GOOGLE_CLIENT_ID: "REPLACE_WITH_GOOGLE_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "REPLACE_WITH_GOOGLE_CLIENT_SECRET"

  COGNITO_CLIENT_SECRET: "REPLACE_WITH_COGNITO_CLIENT_SECRET"

  JWT_SECRET: "REPLACE_WITH_JWT_SECRET"

  REDIS_URL: "REPLACE_WITH_REDIS_URL"

  # Internal service authentication, if enabled
  AGENTIC_SERVICE_KEY: "REPLACE_WITH_INTERNAL_SERVICE_KEY"