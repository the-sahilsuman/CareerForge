apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-service
  namespace: careerforge
  labels:
    app: agentic-service
    app.kubernetes.io/part-of: careerforge

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: agentic-service

  template:
    metadata:
      labels:
        app: agentic-service
        app.kubernetes.io/part-of: careerforge

    spec:
      serviceAccountName: agentic-service

      containers:
        - name: agentic-service

          image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/careerforge-agentic-service:IMAGE_TAG

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8001

          envFrom:

            - configMapRef:
                name: agentic-service-config

            - secretRef:
                name: agentic-service-secret

          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"

            limits:
              cpu: "1500m"
              memory: "2Gi"

          readinessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          terminationMessagePolicy: File

      terminationGracePeriodSeconds: 60