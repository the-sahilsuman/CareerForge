apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-service
  namespace: careerforge
  labels:
    app: agentic-service

spec:
  replicas: 2

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: agentic-service

  template:
    metadata:
      labels:
        app: agentic-service

    spec:

      serviceAccountName: agentic-service

      terminationGracePeriodSeconds: 30

      containers:

        - name: agentic-service

          image: 142545058839.dkr.ecr.ap-south-1.amazonaws.com/careerforge/agentic-service:v1

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8001
              protocol: TCP

          envFrom:

            - configMapRef:
                name: agentic-service-config

            - secretRef:
                name: agentic-service-secrets

          resources:
            requests:
              cpu: 500m
              memory: 1Gi

            limits:
              cpu: 2000m
              memory: 3Gi

          readinessProbe:
            httpGet:
              path: /ready
              port: http

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL