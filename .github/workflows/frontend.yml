name: CareerForge Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: careerforge/frontend
  EKS_CLUSTER_NAME: careerforge-prod
  NAMESPACE: careerforge

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6

      # --------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # Verify AWS identity
      # --------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------
      # ECR Login
      # --------------------------------------------------

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # Check whether this commit image already exists
      # --------------------------------------------------

      - name: Check if image already exists
        id: image-check
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="${GITHUB_SHA}" \
            >/dev/null 2>&1; then

            echo "exists=true" >> "$GITHUB_OUTPUT"

            echo "========================================="
            echo "Image already exists"
            echo "Repository: $ECR_REPOSITORY"
            echo "Tag:        $GITHUB_SHA"
            echo "Skipping Docker build and push."
            echo "========================================="

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"

            echo "========================================="
            echo "Image does not exist"
            echo "Repository: $ECR_REPOSITORY"
            echo "Tag:        $GITHUB_SHA"
            echo "Building and pushing image."
            echo "========================================="

          fi

      # --------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------

      - name: Set up Docker Buildx
        if: steps.image-check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------
      # Multi-platform build + push
      # --------------------------------------------------

      - name: Build and push multi-platform image
        if: steps.image-check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          platforms: |
            linux/amd64
            linux/arm64

          push: true

          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------
      # Configure kubectl
      # --------------------------------------------------

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # --------------------------------------------------
      # Verify EKS connection
      # --------------------------------------------------

      - name: Verify EKS connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      # --------------------------------------------------
      # Ensure namespace exists
      #
      # If careerforge already exists:
      #   nothing is changed.
      #
      # If careerforge does not exist:
      #   namespace.yml creates it.
      # --------------------------------------------------

      - name: Ensure namespace exists
        run: |
          echo "Checking namespace: $NAMESPACE"

          if kubectl get namespace "$NAMESPACE" >/dev/null 2>&1; then
            echo "========================================="
            echo "Namespace already exists"
            echo "Namespace: $NAMESPACE"
            echo "========================================="
          else
            echo "========================================="
            echo "Namespace does not exist"
            echo "Creating namespace from:"
            echo "k8s/namespace.yml"
            echo "========================================="

            kubectl apply -f k8s/namespace.yml

            echo "Waiting for namespace to become available..."

            kubectl wait \
              --for=jsonpath='{.status.phase}'=Active \
              namespace/"$NAMESPACE" \
              --timeout=60s

            echo "Namespace created successfully."
          fi

      # --------------------------------------------------
      # Verify namespace
      # --------------------------------------------------

      - name: Verify namespace
        run: |
          kubectl get namespace "$NAMESPACE"

      # --------------------------------------------------
      # Deploy frontend
      # --------------------------------------------------

      - name: Deploy frontend
        run: |

          echo "========================================="
          echo "Deploying CareerForge Frontend"
          echo "========================================="

          echo "Namespace: $NAMESPACE"
          echo "ECR Repository: $ECR_REPOSITORY"
          echo "Image Tag: $GITHUB_SHA"

          # Apply Kubernetes manifests
          kubectl apply \
            -f k8s/frontend/ \
            -n "$NAMESPACE"

          # Update deployment image
          kubectl -n "$NAMESPACE" set image \
            deployment/frontend \
            frontend=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

          # Wait for deployment
          kubectl -n "$NAMESPACE" rollout status \
            deployment/frontend \
            --timeout=5m

      # --------------------------------------------------
      # Deployment verification
      # --------------------------------------------------

      - name: Verify frontend deployment
        run: |
          echo "========================================="
          echo "Frontend Deployment"
          echo "========================================="

          kubectl -n "$NAMESPACE" get deployment frontend

          echo ""
          echo "========================================="
          echo "Frontend Pods"
          echo "========================================="

          kubectl -n "$NAMESPACE" get pods -l app=frontend

          echo ""
          echo "========================================="
          echo "Frontend Service"
          echo "========================================="

          kubectl -n "$NAMESPACE" get service frontend