name: CareerForge Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: careerforge/frontend
  EKS_CLUSTER_NAME: careerforge-prod
  NAMESPACE: careerforge

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6

      # --------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # Verify AWS identity
      # --------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------
      # Generate unique image tag
      # --------------------------------------------------

      - name: Generate image tag
        id: image-tag
        run: |
          IMAGE_TAG="${GITHUB_SHA}-${GITHUB_RUN_NUMBER}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "========================================="
          echo "Docker Image Tag"
          echo "========================================="
          echo "Commit SHA : $GITHUB_SHA"
          echo "Run Number : $GITHUB_RUN_NUMBER"
          echo "Image Tag  : $IMAGE_TAG"
          echo "========================================="

      # --------------------------------------------------
      # ECR Login
      # --------------------------------------------------

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------
      # Build and push multi-platform image
      # --------------------------------------------------

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          platforms: |
            linux/amd64
            linux/arm64

          push: true

          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------
      # Configure kubectl
      # --------------------------------------------------

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # --------------------------------------------------
      # Verify EKS connection
      # --------------------------------------------------

      - name: Verify EKS connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      # --------------------------------------------------
      # Ensure namespace exists
      # --------------------------------------------------

      - name: Ensure namespace exists
        run: |
          if kubectl get namespace "$NAMESPACE" >/dev/null 2>&1; then

            echo "========================================="
            echo "Namespace already exists"
            echo "Namespace: $NAMESPACE"
            echo "========================================="

          else

            echo "========================================="
            echo "Namespace does not exist"
            echo "Creating from k8s/namespace.yml"
            echo "========================================="

            kubectl apply -f k8s/namespace.yml

            kubectl wait \
              --for=jsonpath='{.status.phase}'=Active \
              namespace/"$NAMESPACE" \
              --timeout=60s

          fi

      # --------------------------------------------------
      # Verify namespace
      # --------------------------------------------------

      - name: Verify namespace
        run: |
          kubectl get namespace "$NAMESPACE"

      # --------------------------------------------------
      # Deploy frontend
      # --------------------------------------------------

      - name: Deploy frontend
        run: |

          echo "========================================="
          echo "Deploying CareerForge Frontend"
          echo "========================================="

          echo "ECR Repository : $ECR_REPOSITORY"
          echo "Image Tag      : $IMAGE_TAG"
          echo "Namespace      : $NAMESPACE"

          # Apply Kubernetes manifests
          kubectl apply \
            -f k8s/frontend/ \
            -n "$NAMESPACE"

          # Update deployment to NEW immutable image
          kubectl -n "$NAMESPACE" set image \
            deployment/frontend \
            frontend=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

          # Wait for rollout
          kubectl -n "$NAMESPACE" rollout status \
            deployment/frontend \
            --timeout=5m

      # --------------------------------------------------
      # Verify deployment
      # --------------------------------------------------

      - name: Verify frontend deployment
        run: |

          echo "========================================="
          echo "Frontend Deployment"
          echo "========================================="

          kubectl -n "$NAMESPACE" get deployment frontend

          echo ""
          echo "========================================="
          echo "Frontend Pods"
          echo "========================================="

          kubectl -n "$NAMESPACE" get pods \
            -l app=frontend

          echo ""
          echo "========================================="
          echo "Frontend Service"
          echo "========================================="

          kubectl -n "$NAMESPACE" get service frontend

          echo ""
          echo "========================================="
          echo "Current Image"
          echo "========================================="

          kubectl -n "$NAMESPACE" get deployment frontend \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""