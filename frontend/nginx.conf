server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------
    # React SPA routing
    # --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------
    # Static assets
    # --------------------------------------------------------
    location /assets/ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --------------------------------------------------------
    # Health check
    # --------------------------------------------------------
    location /health {
        access_log off;

        default_type application/json;

        return 200 '{"status":"healthy","service":"frontend"}';
    }
}